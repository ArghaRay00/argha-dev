<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="ui-sans-serif, system-ui, -apple-system, 'Inter', sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <style>
    .bg    { fill: #fafafa; }
    .box   { fill: none; stroke: #1f2937; stroke-width: 2; }
    .ok    { stroke: #16a34a; stroke-width: 2.5; fill: none; }
    .bad   { stroke: #b91c1c; stroke-width: 2.5; fill: none; stroke-dasharray: 6 3; }
    .player { fill: #e0e7ff; }
    .cdn    { fill: #fef3c7; }
    .pill-ok  { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
    .pill-bad { fill: #fee2e2; stroke: #b91c1c; stroke-width: 1.5; }
    .title   { font-size: 22px; fill: #111827; font-weight: 700; }
    .sub     { font-size: 13px; fill: #6b7280; font-style: italic; }
    .h       { font-size: 18px; fill: #111827; font-weight: 700; }
    .step    { font-size: 13px; fill: #1f2937; }
    .url     { font-size: 12px; fill: #1f2937; font-family: ui-monospace, 'SF Mono', monospace; }
    .status-ok  { fill: #166534; font-size: 15px; font-weight: 700; }
    .status-bad { fill: #991b1b; font-size: 15px; font-weight: 700; }
    .note       { fill: #b91c1c; font-style: italic; font-size: 14px; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="560"/>
  <text x="450" y="32" text-anchor="middle" class="title">CDN token auth breaks on HLS sub-resources</text>
  <text x="450" y="54" text-anchor="middle" class="sub">manifest token authorizes one path · segments live at many paths</text>

  <g transform="translate(40,90)">
    <rect class="player" x="0" y="0" width="210" height="380" rx="8"/>
    <rect class="box"    x="0" y="0" width="210" height="380" rx="8"/>
    <text x="105" y="40" text-anchor="middle" class="h">Shaka Player</text>
    <text x="22"  y="90"  class="step">1. load manifest</text>
    <text x="22"  y="165" class="step">2. parse ABR ladder</text>
    <text x="22"  y="240" class="step">3. fetch sub-manifest</text>
    <text x="22"  y="315" class="step">4. fetch .ts segments</text>
    <text x="105" y="358" text-anchor="middle" class="sub">reuses manifest token</text>
  </g>

  <g transform="translate(650,90)">
    <rect class="cdn" x="0" y="0" width="210" height="380" rx="8"/>
    <rect class="box" x="0" y="0" width="210" height="380" rx="8"/>
    <text x="105" y="40" text-anchor="middle" class="h">Bunny CDN</text>
    <text x="105" y="70" text-anchor="middle" class="sub">per-path HMAC</text>
    <text x="105" y="358" text-anchor="middle" class="sub">token_path doesn't work</text>
  </g>

  <path class="ok"  d="M 250 95 L 650 95" marker-end="url(#a1)"/>
  <text x="450" y="88" text-anchor="middle" class="url">GET /{videoId}/playlist.m3u8?token=X</text>
  <g transform="translate(405,100)">
    <rect class="pill-ok" x="0" y="0" width="90" height="24" rx="12"/>
    <text x="45" y="17" text-anchor="middle" class="status-ok">200 OK</text>
  </g>

  <path class="bad" d="M 250 250 L 650 250" marker-end="url(#a2)"/>
  <text x="450" y="243" text-anchor="middle" class="url">GET /{videoId}/360p/video.m3u8?token=X</text>
  <g transform="translate(415,255)">
    <rect class="pill-bad" x="0" y="0" width="70" height="24" rx="12"/>
    <text x="35" y="17" text-anchor="middle" class="status-bad">403</text>
  </g>

  <path class="bad" d="M 250 400 L 650 400" marker-end="url(#a2)"/>
  <text x="450" y="393" text-anchor="middle" class="url">GET /{videoId}/360p/seg-1.ts?token=X</text>
  <g transform="translate(400,405)">
    <rect class="pill-bad" x="0" y="0" width="100" height="24" rx="12"/>
    <text x="50" y="17" text-anchor="middle" class="status-bad">403 × N</text>
  </g>

  <text x="450" y="510" text-anchor="middle" class="note">manifest token matches one path; segments live at N different paths.</text>
  <text x="450" y="534" text-anchor="middle" class="note">fix: sign per-segment via Shaka request filter, or enable DRM and skip URL signing.</text>
</svg>
