<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="ui-sans-serif, system-ui, -apple-system, 'Inter', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <style>
    .bg   { fill: #fafafa; }
    .box  { fill: none; stroke: #1f2937; stroke-width: 2; }
    .line { stroke: #1f2937; stroke-width: 2; fill: none; }
    .browser { fill: #e0e7ff; }
    .cloud   { fill: #dbeafe; }
    .caddy   { fill: #fef3c7; }
    .svc     { fill: #dcfce7; }
    .media   { fill: #fce7f3; }
    .title { font-size: 22px; fill: #111827; font-weight: 700; }
    .h     { font-size: 17px; fill: #111827; font-weight: 700; }
    .s     { font-size: 13px; fill: #374151; }
    .tag   { font-size: 12px; fill: #6b7280; font-style: italic; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="480"/>
  <text x="450" y="36" text-anchor="middle" class="title">single-origin reverse proxy — one domain, no CORS</text>

  <g transform="translate(40,80)">
    <rect class="browser" x="0" y="0" width="170" height="100" rx="8"/>
    <rect class="box"     x="0" y="0" width="170" height="100" rx="8"/>
    <text x="85" y="38" text-anchor="middle" class="h">browser</text>
    <text x="85" y="62" text-anchor="middle" class="s">Shaka Player</text>
    <text x="85" y="82" text-anchor="middle" class="tag">single domain</text>
  </g>

  <path class="line" d="M 215 130 L 265 130" marker-end="url(#a)"/>

  <g transform="translate(270,80)">
    <rect class="cloud" x="0" y="0" width="180" height="100" rx="8"/>
    <rect class="box"   x="0" y="0" width="180" height="100" rx="8"/>
    <text x="90" y="38" text-anchor="middle" class="h">Cloudflare Tunnel</text>
    <text x="90" y="62" text-anchor="middle" class="s">TLS · DDoS</text>
    <text x="90" y="82" text-anchor="middle" class="tag">no open ports</text>
  </g>

  <path class="line" d="M 455 130 L 505 130" marker-end="url(#a)"/>

  <g transform="translate(510,80)">
    <rect class="caddy" x="0" y="0" width="350" height="100" rx="8"/>
    <rect class="box"   x="0" y="0" width="350" height="100" rx="8"/>
    <text x="175" y="38" text-anchor="middle" class="h">Caddy reverse proxy</text>
    <text x="175" y="62" text-anchor="middle" class="s">25-line config · 3 route blocks</text>
    <text x="175" y="82" text-anchor="middle" class="tag">routes by path prefix</text>
  </g>

  <path class="line" d="M 610 180 L 225 280" marker-end="url(#a)"/>
  <path class="line" d="M 685 180 L 605 280" marker-end="url(#a)"/>
  <path class="line" d="M 760 180 L 790 280" marker-end="url(#a)"/>

  <g transform="translate(110,290)">
    <rect class="svc" x="0" y="0" width="200" height="100" rx="8"/>
    <rect class="box" x="0" y="0" width="200" height="100" rx="8"/>
    <text x="100" y="38" text-anchor="middle" class="h">/  frontend</text>
    <text x="100" y="62" text-anchor="middle" class="s">React + Vite (static SPA)</text>
    <text x="100" y="82" text-anchor="middle" class="tag">served as files</text>
  </g>

  <g transform="translate(490,290)">
    <rect class="svc" x="0" y="0" width="200" height="100" rx="8"/>
    <rect class="box" x="0" y="0" width="200" height="100" rx="8"/>
    <text x="100" y="38" text-anchor="middle" class="h">/api/*</text>
    <text x="100" y="62" text-anchor="middle" class="s">NestJS · JWT · sessions</text>
    <text x="100" y="82" text-anchor="middle" class="tag">same-origin cookies</text>
  </g>

  <g transform="translate(700,290)">
    <rect class="media" x="0" y="0" width="180" height="100" rx="8"/>
    <rect class="box"   x="0" y="0" width="180" height="100" rx="8"/>
    <text x="90" y="38" text-anchor="middle" class="h">/content/*</text>
    <text x="90" y="62" text-anchor="middle" class="s">HLS segments</text>
    <text x="90" y="82" text-anchor="middle" class="tag">immutable, cached</text>
  </g>

  <text x="450" y="440" text-anchor="middle" class="tag">Everything behind one domain. No CORS. Same-origin cookies. DRM can slot in at /api/license.</text>
</svg>
